# LiveDeck — mapping du DJControl Mix
#
# Chaque [[bind]] relie un contrôle à une action. Modifiable sans recompiler : relancer l'app.
#
# Contrôles : a.<x> / b.<x> pour les decks (play, cue, sync, pfl, volume, filter, bass, tempo,
#   jog.edge, jog.top, pad.<hotcue|sampler|fx|loop>.<1-4>), mixer.<crossfader|master|headphone>, vinyl.
#   shift = true : la même touche avec Shift tenu.
# Actions disponibles (itération 013 ; les actions musicales arrivent avec les decks, 010+) :
#   transport_toggle, transport_restart, tap_tempo, metronome_toggle   → boutons et pads
#   pattern (pattern = 1–4), drum (voice = kick, snare, closed_hat, open_hat, clap, perc),
#   mute (voices = [liste de voix]), fill (fill = 1–4)                → pads
#     chaque frappe de drum affiche aussi sa latence geste → son
#   beat_repeat (division = 4, 8, 16, 32 pour 1/4 … 1/32), tant que le pad est tenu → pads
#   swing (step = % par cran)                                          → jogs
#   tempo (range = [min, max] en BPM), master_gain, metronome_level,
#   drum_level, drum_density (0 = kicks sur les temps → 1 = complet)   → faders et potards
#   tempo_nudge (step = BPM par cran)                                  → jogs
#   bass_line (pattern = 1–4), bass_mute, tonic (step = demi-tons)     → boutons et pads
#   bass_cutoff (coupure du filtre de la basse)                        → potards
#   pickup = true : soft-takeover (le contrôle ne prend la main qu'en rejoignant la valeur actuelle).

# --- Transport ---
[[bind]]
control = "a.play"
action = "transport_toggle"

[[bind]]
control = "b.play"
action = "transport_toggle"

[[bind]]
control = "a.play"
shift = true
action = "transport_restart"

[[bind]]
control = "a.sync"
action = "tap_tempo"

[[bind]]
control = "a.pfl"
action = "metronome_toggle"

# --- Deck A : patterns de batterie (011) avec leur ligne de basse (013), à la mesure suivante ---
[[bind]]
control = "a.pad.hotcue.1"
action = "pattern"
pattern = 1

[[bind]]
control = "a.pad.hotcue.2"
action = "pattern"
pattern = 2

[[bind]]
control = "a.pad.hotcue.3"
action = "pattern"
pattern = 3

[[bind]]
control = "a.pad.hotcue.4"
action = "pattern"
pattern = 4

[[bind]]
control = "a.pad.hotcue.1"
shift = true
action = "bass_line"
pattern = 1

[[bind]]
control = "a.pad.hotcue.2"
shift = true
action = "bass_line"
pattern = 2

[[bind]]
control = "a.pad.hotcue.3"
shift = true
action = "bass_line"
pattern = 3

[[bind]]
control = "a.pad.hotcue.4"
shift = true
action = "bass_line"
pattern = 4

# --- Basse (013) : mute sur Cue A, filtre au potard Bass A, tonique sur Cue B (à la mesure) ---
[[bind]]
control = "a.cue"
action = "bass_mute"

[[bind]]
control = "a.bass"
action = "bass_cutoff"

[[bind]]
control = "b.cue"
action = "tonic"
step = -1

[[bind]]
control = "b.cue"
shift = true
action = "tonic"
step = 1

[[bind]]
control = "a.jog.edge"
action = "swing"
# % de swing par cran du jog (248 crans par tour)
step = 0.2

# --- Deck A : fills (itération 012), de la prochaine noire à la fin de la mesure ---
#   1 roll de caisse claire · 2 roll de perc · 3 break de kick · 4 montée de hats
[[bind]]
control = "a.pad.sampler.1"
action = "fill"
fill = 1

[[bind]]
control = "a.pad.sampler.2"
action = "fill"
fill = 2

[[bind]]
control = "a.pad.sampler.3"
action = "fill"
fill = 3

[[bind]]
control = "a.pad.sampler.4"
action = "fill"
fill = 4

# --- Deck A : mutes (012), immédiats ; LED allumée = la voix joue ---
[[bind]]
control = "a.pad.fx.1"
action = "mute"
voices = ["kick"]

[[bind]]
control = "a.pad.fx.2"
action = "mute"
voices = ["snare", "clap"]

[[bind]]
control = "a.pad.fx.3"
action = "mute"
voices = ["closed_hat", "open_hat"]

[[bind]]
control = "a.pad.fx.4"
action = "mute"
voices = ["perc"]

# --- Deck A : beat-repeat (012) du bus batterie, tant que le pad est tenu ---
[[bind]]
control = "a.pad.loop.1"
action = "beat_repeat"
division = 4

[[bind]]
control = "a.pad.loop.2"
action = "beat_repeat"
division = 8

[[bind]]
control = "a.pad.loop.3"
action = "beat_repeat"
division = 16

[[bind]]
control = "a.pad.loop.4"
action = "beat_repeat"
division = 32

# --- Sons seuls (010) : Shift + pads Sampler A, pads Hot Cue B en attendant la mélodie ---
[[bind]]
control = "a.pad.sampler.1"
shift = true
action = "drum"
voice = "kick"

[[bind]]
control = "a.pad.sampler.2"
shift = true
action = "drum"
voice = "snare"

[[bind]]
control = "a.pad.sampler.3"
shift = true
action = "drum"
voice = "closed_hat"

[[bind]]
control = "a.pad.sampler.4"
shift = true
action = "drum"
voice = "open_hat"

[[bind]]
control = "b.pad.hotcue.1"
action = "drum"
voice = "clap"

[[bind]]
control = "b.pad.hotcue.2"
action = "drum"
voice = "perc"

# --- Densité de la batterie (012) : le fader suit sa position physique, sans pickup ---
[[bind]]
control = "a.tempo"
action = "drum_density"

# --- Tempo : jog A par le dessus, tap tempo sur Sync A ---
[[bind]]
control = "a.jog.top"
action = "tempo_nudge"
# 248 crans par tour : 0,25 BPM/cran ≈ 60 BPM par tour (1,0 était beaucoup trop sensible, essai 008).
step = 0.25

# --- Niveaux ---
[[bind]]
control = "mixer.master"
action = "master_gain"
pickup = true

[[bind]]
control = "a.volume"
action = "drum_level"
pickup = true

[[bind]]
control = "b.volume"
action = "metronome_level"
pickup = true
