# LiveDeck — mapping du DJControl Mix
#
# Chaque [[bind]] relie un contrôle à une action. Modifiable sans recompiler : relancer l'app.
#
# Contrôles : a.<x> / b.<x> pour les decks (play, cue, sync, pfl, volume, filter, bass, tempo,
#   jog.edge, jog.top, pad.<hotcue|sampler|fx|loop>.<1-4>), mixer.<crossfader|master|headphone>, vinyl.
#   shift = true : la même touche avec Shift tenu.
# Actions disponibles (itération 019 ; les actions musicales arrivent avec les decks, 010+) :
#   transport_toggle, transport_restart, tap_tempo, metronome_toggle   → boutons et pads
#   pattern (pattern = 1–4), drum (voice = kick, snare, closed_hat, open_hat, clap, perc),
#   mute (voices = [liste de voix]), fill (fill = 1–4)                → pads
#     chaque frappe de drum affiche aussi sa latence geste → son
#   beat_repeat (division = 4, 8, 16, 32 pour 1/4 … 1/32), tant que le pad est tenu → pads
#   swing (step = % par cran)                                          → jogs
#   tempo (range = [min, max] en BPM), master_gain, metronome_level,
#   drum_level, bass_level, drum_density (0 = kicks sur les temps → 1 = complet)   → faders et potards
#   tempo_nudge (step = BPM par cran)                                  → jogs
#   bass_line (pattern = 1–4), bass_mute, tonic (step = demi-tons)     → boutons et pads
#   bass_cutoff (coupure du filtre de la basse)                        → potards
#   style (step = crans de jog par style), kit (pattern = 1–3), à la mesure suivante → jogs, pads
#   density_nudge (step = % par cran)                                    → jogs
#   swing_set (step = swing en %)                                        → pads
#   bass_resonance, bass_env, bass_decay, bass_amp_decay (son de la basse), random_bass_line → potards, faders, pads
#   samples_toggle (batterie : samples ↔ synthé, à la mesure)          → boutons et pads
#   chord (chord = 1–4 : degrés I, IV, V, vi), tenu tant que le pad l'est → pads
#   melody_level, brightness (coupure du synthé mélodie)               → faders et potards
#   latch_toggle, inversion / chord_octave (step = ±1),
#   extension (step = 1 : suivante, 0 : retour à la triade)            → boutons et pads
#   scale (step = crans de jog par gamme), à la mesure                 → jogs
#   arp_mode (mode = off, up, updown, random), arp_octaves (octaves = 1–4) → pads
#   arp_rate (step = crans de jog par vitesse), transpose (step = crans de jog par degré) → jogs
#   phrase (pattern = 1–4, variation = true : seconde moitié une tierce plus haut), à la mesure → pads
#   note_mode (accords ↔ notes sur les pads chord), loop / loop_clear (pattern = 1–4), loop_rec,
#   loop_bars (step = crans de jog par longueur)                        → boutons, pads, jogs
#   crossfade (fondu rythme ↔ mélodie, centre = les deux)               → crossfader
#   delay_send, delay_feedback (envoi et répétitions du delay de la mélodie),
#   reverb_send (envoi de tout le mix à la réverb)                     → potards
#   delay_time (1/8 pointé → 1/4 → 1/8 → 1/4 pointé → 1/16, le style remet le sien) → boutons et pads
#   pickup = true : soft-takeover (le contrôle ne prend la main qu'en rejoignant la valeur actuelle).

# --- Transport ---
[[bind]]
control = "a.play"
action = "transport_toggle"

[[bind]]
control = "b.play"
action = "transport_toggle"

[[bind]]
control = "a.play"
shift = true
action = "transport_restart"

[[bind]]
control = "a.sync"
action = "tap_tempo"

[[bind]]
control = "a.pfl"
action = "metronome_toggle"

# --- Deck A : patterns de batterie (011) avec leur ligne de basse (013), à la mesure suivante ---
[[bind]]
control = "a.pad.hotcue.1"
action = "pattern"
pattern = 1

[[bind]]
control = "a.pad.hotcue.2"
action = "pattern"
pattern = 2

[[bind]]
control = "a.pad.hotcue.3"
action = "pattern"
pattern = 3

[[bind]]
control = "a.pad.hotcue.4"
action = "pattern"
pattern = 4

[[bind]]
control = "a.pad.hotcue.1"
shift = true
action = "bass_line"
pattern = 1

[[bind]]
control = "a.pad.hotcue.2"
shift = true
action = "bass_line"
pattern = 2

[[bind]]
control = "a.pad.hotcue.3"
shift = true
action = "bass_line"
pattern = 3

[[bind]]
control = "a.pad.hotcue.4"
shift = true
action = "bass_line"
pattern = 4

# --- Basse (013) : mute sur Cue A, coupure au potard Filter A (R1), tonique sur Cue B (à la mesure) ---
[[bind]]
control = "a.cue"
action = "bass_mute"

[[bind]]
control = "a.filter"
action = "bass_cutoff"

# Son de la basse (R2). Deux couches par contrôle : chacune attend que le potard rejoigne sa valeur
# (pickup) quand on passe de l'une à l'autre avec Shift.
#   Bass A = résonance · Shift : quantité d'enveloppe du filtre
#   Fader Tempo A = decay de l'enveloppe du filtre · Shift : decay de l'amplitude (en haut : tenue)
[[bind]]
control = "a.bass"
action = "bass_resonance"
pickup = true

[[bind]]
control = "a.bass"
shift = true
action = "bass_env"
pickup = true

[[bind]]
control = "a.tempo"
action = "bass_decay"
pickup = true

[[bind]]
control = "a.tempo"
shift = true
action = "bass_amp_decay"
pickup = true

[[bind]]
control = "b.cue"
action = "tonic"
step = -1

[[bind]]
control = "b.cue"
shift = true
action = "tonic"
step = 1

# Jog A par la tranche (R1) : densité de la batterie, % par cran (248 crans par tour ≈ 50 % par tour).
# 0 = kicks sur les temps seulement → 100 % = le pattern complet.
[[bind]]
control = "a.jog.edge"
action = "density_nudge"
step = 0.2

# --- Deck A : fills (itération 012), de la prochaine noire à la fin de la mesure ---
#   1 roll de caisse claire · 2 roll de perc · 3 break de kick · 4 montée de hats
[[bind]]
control = "a.pad.sampler.1"
action = "fill"
fill = 1

[[bind]]
control = "a.pad.sampler.2"
action = "fill"
fill = 2

[[bind]]
control = "a.pad.sampler.3"
action = "fill"
fill = 3

[[bind]]
control = "a.pad.sampler.4"
action = "fill"
fill = 4

# --- Deck A : mutes (012), immédiats ; LED allumée = la voix joue ---
[[bind]]
control = "a.pad.fx.1"
action = "mute"
voices = ["kick"]

[[bind]]
control = "a.pad.fx.2"
action = "mute"
voices = ["snare", "clap"]

[[bind]]
control = "a.pad.fx.3"
action = "mute"
voices = ["closed_hat", "open_hat"]

[[bind]]
control = "a.pad.fx.4"
action = "mute"
voices = ["perc"]

# --- Deck A : beat-repeat (012) du bus batterie, tant que le pad est tenu ---
[[bind]]
control = "a.pad.loop.1"
action = "beat_repeat"
division = 4

[[bind]]
control = "a.pad.loop.2"
action = "beat_repeat"
division = 8

[[bind]]
control = "a.pad.loop.3"
action = "beat_repeat"
division = 16

[[bind]]
control = "a.pad.loop.4"
action = "beat_repeat"
division = 32

# --- Kits (R1) : Shift + pads Sampler A 1–3 = 808 · boom, 909 · techno, Dub, à la mesure ---
# (Shift + pad 4 : ligne de basse au hasard, en R2.)
[[bind]]
control = "a.pad.sampler.1"
shift = true
action = "kit"
pattern = 1

[[bind]]
control = "a.pad.sampler.2"
shift = true
action = "kit"
pattern = 2

[[bind]]
control = "a.pad.sampler.3"
shift = true
action = "kit"
pattern = 3

# Shift + pad Sampler A 4 (R2) : ligne de basse tirée au hasard dans la gamme, à la mesure.
[[bind]]
control = "a.pad.sampler.4"
shift = true
action = "random_bass_line"


# --- Kit (015) : Shift + PFL A bascule la batterie entre les samples 909 et le synthé, à la mesure ---
[[bind]]
control = "a.pfl"
shift = true
action = "samples_toggle"

# --- Tempo : Shift + jog A, tranche ou dessus (essai R1 : le toucher du dessus ne sépare pas deux
# fonctions de façon fiable, la main est souvent posée sur le jog) ; tap tempo sur Sync A ---
[[bind]]
control = "a.jog.edge"
shift = true
action = "tempo_nudge"
# 248 crans par tour : 0,25 BPM/cran ≈ 60 BPM par tour (essai 008).
step = 0.25

[[bind]]
control = "a.jog.top"
shift = true
action = "tempo_nudge"
step = 0.25

# Densité aussi par le dessus du jog A : tout le jog fait la densité.
[[bind]]
control = "a.jog.top"
action = "density_nudge"
step = 0.2

# --- Swing (essai R1) : Shift + pads Loop A = 50 · 54 · 58 · 62 %, tout de suite ---
[[bind]]
control = "a.pad.loop.1"
shift = true
action = "swing_set"
step = 50

[[bind]]
control = "a.pad.loop.2"
shift = true
action = "swing_set"
step = 54

[[bind]]
control = "a.pad.loop.3"
shift = true
action = "swing_set"
step = 58

[[bind]]
control = "a.pad.loop.4"
shift = true
action = "swing_set"
step = 62

# --- Niveaux ---
[[bind]]
control = "mixer.master"
action = "master_gain"
pickup = true

[[bind]]
control = "a.volume"
action = "drum_level"
pickup = true

# Shift + Volume A : niveau de la basse (015). Le fader rejoint chaque niveau avant de le changer.
[[bind]]
control = "a.volume"
shift = true
action = "bass_level"
pickup = true

# --- Deck B : mélodie (016) — accords tenus aux pads Hot Cue, joués tout de suite ---
[[bind]]
control = "b.pad.hotcue.1"
action = "chord"
chord = 1

[[bind]]
control = "b.pad.hotcue.2"
action = "chord"
chord = 2

[[bind]]
control = "b.pad.hotcue.3"
action = "chord"
chord = 3

[[bind]]
control = "b.pad.hotcue.4"
action = "chord"
chord = 4

# Shift + pads Hot Cue B : ii, iii, vii, I à l'octave (017)
[[bind]]
control = "b.pad.hotcue.1"
shift = true
action = "chord"
chord = 5

[[bind]]
control = "b.pad.hotcue.2"
shift = true
action = "chord"
chord = 6

[[bind]]
control = "b.pad.hotcue.3"
shift = true
action = "chord"
chord = 7

[[bind]]
control = "b.pad.hotcue.4"
shift = true
action = "chord"
chord = 8

# --- Deck B : voicings (017) aux pads Loop — latch, renversement, octave, extension ---
[[bind]]
control = "b.pad.loop.1"
action = "latch_toggle"

[[bind]]
control = "b.pad.loop.2"
action = "inversion"
step = 1

[[bind]]
control = "b.pad.loop.2"
shift = true
action = "inversion"
step = -1

[[bind]]
control = "b.pad.loop.3"
action = "chord_octave"
step = 1

[[bind]]
control = "b.pad.loop.3"
shift = true
action = "chord_octave"
step = -1

[[bind]]
control = "b.pad.loop.4"
action = "extension"
step = 1

[[bind]]
control = "b.pad.loop.4"
shift = true
action = "extension"
step = 0

# --- Gamme (017) : Shift + jog droit, un demi-tour par gamme, à la mesure ---
[[bind]]
control = "b.jog.edge"
shift = true
action = "scale"
step = 124

# Shift + jog B par le dessus : longueur de la prochaine boucle (1, 2, 4 mesures), un cran par
# quart de tour (026). La gamme reste sur Shift + jog B par la tranche.
[[bind]]
control = "b.jog.top"
shift = true
action = "loop_bars"
step = 62

# --- Arpège (018) : pads FX B = mode, Shift = octaves ; bord du jog B = vitesse ---
[[bind]]
control = "b.pad.fx.1"
action = "arp_mode"
mode = "off"

[[bind]]
control = "b.pad.fx.1"
shift = true
action = "arp_octaves"
octaves = 1

[[bind]]
control = "b.pad.fx.2"
action = "arp_mode"
mode = "up"

[[bind]]
control = "b.pad.fx.2"
shift = true
action = "arp_octaves"
octaves = 2

[[bind]]
control = "b.pad.fx.3"
action = "arp_mode"
mode = "updown"

[[bind]]
control = "b.pad.fx.3"
shift = true
action = "arp_octaves"
octaves = 3

[[bind]]
control = "b.pad.fx.4"
action = "arp_mode"
mode = "random"

[[bind]]
control = "b.pad.fx.4"
shift = true
action = "arp_octaves"
octaves = 4

# Crans de jog par vitesse (1/4, 1/8, 1/8T, 1/16, 1/16T, 1/32) : un quart de tour
[[bind]]
control = "b.jog.edge"
action = "arp_rate"
step = 62

# --- Boucles de mélodie (026) : pads Sampler B ---
# Vide : enregistre les notes jouées dès la mesure suivante, pendant la longueur choisie, puis la
# boucle tourne. Enregistrée : lance ou arrête à la mesure. Shift : efface la boucle.
[[bind]]
control = "b.pad.sampler.1"
action = "loop"
pattern = 1

[[bind]]
control = "b.pad.sampler.1"
shift = true
action = "loop_clear"
pattern = 1

[[bind]]
control = "b.pad.sampler.2"
action = "loop"
pattern = 2

[[bind]]
control = "b.pad.sampler.2"
shift = true
action = "loop_clear"
pattern = 2

[[bind]]
control = "b.pad.sampler.3"
action = "loop"
pattern = 3

[[bind]]
control = "b.pad.sampler.3"
shift = true
action = "loop_clear"
pattern = 3

[[bind]]
control = "b.pad.sampler.4"
action = "loop"
pattern = 4

[[bind]]
control = "b.pad.sampler.4"
shift = true
action = "loop_clear"
pattern = 4

# --- Transposition (018) : jog B par le dessus, un degré par quart de tour, tout de suite ---
[[bind]]
control = "b.jog.top"
action = "transpose"
step = 62

[[bind]]
control = "b.tempo"
action = "brightness"

[[bind]]
control = "b.volume"
action = "melody_level"
pickup = true

[[bind]]
control = "b.volume"
shift = true
action = "metronome_level"
pickup = true

# --- Effets (019) : delay de la mélodie au potard Bass B (Shift : répétitions), réverb au Headphone ---
[[bind]]
control = "b.bass"
action = "delay_send"
pickup = true

[[bind]]
control = "b.bass"
shift = true
action = "delay_feedback"
pickup = true

[[bind]]
control = "mixer.headphone"
action = "reverb_send"

# Crossfader (024) : fondu entre les decks. Au centre les deux sonnent ; à gauche le rythme seul,
# à droite la mélodie seule. Les échos et la réverb du deck qui part continuent de résonner.
[[bind]]
control = "mixer.crossfader"
action = "crossfade"

[[bind]]
control = "b.pfl"
shift = true
action = "delay_time"

# PFL B (026) : REC. La première boucle vide enregistre ce qui se joue au deck B (accords et notes)
# dès la mesure suivante ; rappuyer annule. On reste en mode Hot Cue pour jouer.
[[bind]]
control = "b.pfl"
action = "loop_rec"

# Sync B (026) : les pads Hot Cue B jouent des accords ou des notes (degrés 1 à 8 de la gamme).
[[bind]]
control = "b.sync"
action = "note_mode"
