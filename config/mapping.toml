# LiveDeck — mapping du DJControl Mix
#
# Chaque [[bind]] relie un contrôle à une action. Modifiable sans recompiler : relancer l'app.
#
# Contrôles : a.<x> / b.<x> pour les decks (play, cue, sync, pfl, volume, filter, bass, tempo,
#   jog.edge, jog.top, pad.<hotcue|sampler|fx|loop>.<1-4>), mixer.<crossfader|master|headphone>, vinyl.
#   shift = true : la même touche avec Shift tenu.
# Actions disponibles (itération 011 ; les actions musicales arrivent avec les decks, 010+) :
#   transport_toggle, transport_restart, tap_tempo, metronome_toggle   → boutons et pads
#   pattern (pattern = 1–4), drum (voice = kick, snare, closed_hat, open_hat, clap, perc) → pads
#   swing (step = % par cran)                                          → jogs
#     chaque frappe affiche aussi sa latence geste → son
#   tempo (range = [min, max] en BPM), master_gain, metronome_level,
#   drum_level                                                         → faders et potards
#   tempo_nudge (step = BPM par cran)                                  → jogs
#   pickup = true : soft-takeover (le contrôle ne prend la main qu'en rejoignant la valeur actuelle).

# --- Transport ---
[[bind]]
control = "a.play"
action = "transport_toggle"

[[bind]]
control = "b.play"
action = "transport_toggle"

[[bind]]
control = "a.play"
shift = true
action = "transport_restart"

[[bind]]
control = "a.sync"
action = "tap_tempo"

[[bind]]
control = "a.pfl"
action = "metronome_toggle"

# --- Deck A : patterns de batterie (itération 011), changement à la mesure suivante ---
[[bind]]
control = "a.pad.hotcue.1"
action = "pattern"
pattern = 1

[[bind]]
control = "a.pad.hotcue.2"
action = "pattern"
pattern = 2

[[bind]]
control = "a.pad.hotcue.3"
action = "pattern"
pattern = 3

[[bind]]
control = "a.pad.hotcue.4"
action = "pattern"
pattern = 4

[[bind]]
control = "a.jog.edge"
action = "swing"
# % de swing par cran du jog (248 crans par tour)
step = 0.2

# --- Sons seuls (010) : pads Sampler A en attendant les fills (012), pads Hot Cue B en attendant la mélodie ---
[[bind]]
control = "a.pad.sampler.1"
action = "drum"
voice = "kick"

[[bind]]
control = "a.pad.sampler.2"
action = "drum"
voice = "snare"

[[bind]]
control = "a.pad.sampler.3"
action = "drum"
voice = "closed_hat"

[[bind]]
control = "a.pad.sampler.4"
action = "drum"
voice = "open_hat"

[[bind]]
control = "b.pad.hotcue.1"
action = "drum"
voice = "clap"

[[bind]]
control = "b.pad.hotcue.2"
action = "drum"
voice = "perc"

# --- Tempo ---
[[bind]]
control = "a.tempo"
action = "tempo"
range = [60.0, 200.0]
pickup = true

[[bind]]
control = "a.jog.top"
action = "tempo_nudge"
# 248 crans par tour : 0,25 BPM/cran ≈ 60 BPM par tour (1,0 était beaucoup trop sensible, essai 008).
step = 0.25

# --- Niveaux ---
[[bind]]
control = "mixer.master"
action = "master_gain"
pickup = true

[[bind]]
control = "a.volume"
action = "drum_level"
pickup = true

[[bind]]
control = "b.volume"
action = "metronome_level"
pickup = true
