<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LiveDeck D8 — haute fidélité, écran central</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#2BC8FF}a:hover{color:#BBEDFF}
</style>
</helmet>
<div style="width: 1280px; height: 960px; box-sizing: border-box; padding: 24px; background: #0A0A0B; color: #E8E8EA; font-family: Inter, sans-serif; font-weight: 500; display: grid; grid-template-columns: 280px 1fr 280px; gap: 24px">

  <sc-for list="{{sides}}" as="d" hint-placeholder-count="1">
    <div style="display: flex; flex-direction: column; gap: 16px; order: {{d.order}}">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: {{d.color}}">{{d.title}}</span>
        <span style="font-size: 12px; color: #8A8A90">{{d.side}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{d.rings}}" as="k" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px">
            <svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true">
              <circle cx="28" cy="28" r="22" fill="none" stroke="#1A1A1D" stroke-width="7"></circle>
              <circle cx="28" cy="28" r="22" fill="none" stroke="{{k.color}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{k.dash}}" transform="rotate(-90 28 28)"></circle>
            </svg>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px">{{k.name}}</span>
              <span style="font-size: 14px; color: #E8E8EA; font-weight: 700">{{k.value}}</span>
              <span style="font-size: 12px; color: #8A8A90">{{k.ctl}}</span>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="height: 1px; background: #2A2A2E"></div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap">
        <sc-for list="{{d.tabs}}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{d.pads}}" as="p" hint-placeholder-count="4">
          <button type="button" onClick="{{p.press}}" style="{{p.style}}">
            <span style="font-size: 22px; font-weight: 700; text-align: left">{{p.name}}</span>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.75; text-align: left">{{p.sub}}</span>
          </button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #8A8A90; line-height: 1.5">{{d.padHint}}</span>
      <div style="flex-grow: 1"></div>
      <button type="button" onClick="{{toggleShift}}" style="{{shiftStyle}}">Shift</button>
      <span style="font-size: 12px; color: #8A8A90; line-height: 1.5">{{d.jogHint}}</span>
    </div>
  </sc-for>

  <div style="order: 2; background: #121214; border-radius: 6px; border: 1px solid #2A2A2E; padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 18px">
      <button type="button" aria-label="Lecture / arrêt (Play)" onClick="{{togglePlay}}" style="width: 44px; height: 44px; border: none; border-radius: 4px; background: #1A1A1D; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M1 1 L15 9 L1 17 Z" fill="#E8E8EA"></path></svg></sc-if>
        <sc-if value="{{stopped}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" fill="#8A8A90"></rect></svg></sc-if>
      </button>
      <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 36px; font-weight: 700">124</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8A8A90">BPM</span></div>
      <span style="font-size: 22px; font-weight: 700">{{position}}</span>
      <div style="display: flex; gap: 4px">
        <sc-for list="{{beats}}" as="b" hint-placeholder-count="4"><div style="{{b}}"></div></sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-size: 22px; font-weight: 700">La mineur</span>
        <span style="font-size: 14px; color: #8A8A90">kit <span style="color: #E8E8EA">{{kit}}</span> · swing 54 %</span>
      </div>
    </div>
    <div style="height: 1px; background: #2A2A2E"></div>

    <sc-for list="{{tracks}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: {{t.color}}">{{t.name}}</span>
          <span style="font-size: 14px; color: #8A8A90">{{t.info}}</span>
        </div>
        <div style="{{t.box}}">
          <sc-for list="{{t.grid}}" as="g" hint-placeholder-count="4"><div style="{{g}}"></div></sc-for>
          <sc-for list="{{t.marks}}" as="m" hint-placeholder-count="6"><div style="{{m}}"></div></sc-for>
          <div style="{{playhead}}"></div>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; gap: 10px; align-items: center; min-height: 36px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8A8A90">À LA MESURE</span>
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="2"><div style="{{q.style}}">{{q.text}}</div></sc-for>
      <sc-if value="{{queueEmpty}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #3A3A40">rien en attente</span></sc-if>
      <div style="flex-grow: 1"></div>
      <span style="font-size: 14px; color: #8A8A90">{{untilBar}}</span>
    </div>

    <div style="flex-grow: 1"></div>
    <div style="height: 1px; background: #2A2A2E"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8A8A90"><span>RYTHME</span><span>MÉLODIE</span></div>
        <div style="position: relative; height: 8px; border-radius: 4px; background: #1A1A1D">
          <div style="position: absolute; left: 50%; top: -6px; width: 6px; height: 20px; margin-left: -3px; border-radius: 2px; background: #E8E8EA"></div>
        </div>
        <span style="font-size: 12px; color: #8A8A90">Crossfader · fondu</span>
      </div>
      <sc-for list="{{mixer}}" as="k" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="44" height="44" viewBox="0 0 56 56" aria-hidden="true">
            <circle cx="28" cy="28" r="22" fill="none" stroke="#1A1A1D" stroke-width="7"></circle>
            <circle cx="28" cy="28" r="22" fill="none" stroke="#E8E8EA" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{k.dash}}" transform="rotate(-90 28 28)"></circle>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px">{{k.name}} <span style="font-weight: 700">{{k.value}}</span></span>
            <span style="font-size: 12px; color: #8A8A90">{{k.ctl}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      playing: true, step: 38, shift: false, modeA: 0, modeB: 0,
      pattern: 1, pendingPattern: null, line: 2, pendingLine: null, kit: 'Dub', pendingKit: null,
      fill: null, mutes: [false, false, false, false], repeat: null,
      chords: [true, false, false, false], phrase: [[0, 2, 5], [3, 1, 4], [6, 2, 3], [8, 3, 2], [10, 1, 5], [12, 2, 4], [14, 2, 2]],
      frozen: true, pendingPhrase: null,
      rec: false, latch: true, octave: 0, ext: 0, arp: false, delayTime: 0, throwD: false, throwR: false
    };
  }
  componentDidMount() { this.timer = setInterval(() => this.tick(), 121); }
  componentWillUnmount() { clearInterval(this.timer); }
  tick() {
    if (!this.state.playing) return;
    const next = this.state.step + 1;
    const s = { step: next };
    if (next % 16 === 0) {
      const st = this.state;
      if (st.pendingPattern !== null) { s.pattern = st.pendingPattern; s.pendingPattern = null; }
      if (st.pendingLine !== null) { s.line = st.pendingLine; s.pendingLine = null; }
      if (st.pendingKit !== null) { s.kit = st.pendingKit; s.pendingKit = null; }
      if (st.pendingPhrase !== null) { s.phrase = st.pendingPhrase.notes; s.pendingPhrase = null; }
      s.fill = st.fill && st.fill.armed ? { n: st.fill.n, armed: false } : null;
    }
    this.setState(s);
  }
  phraseFrom(base) {
    const r = () => Math.random();
    if (base) {
      const notes = base.map((n) => n.slice());
      for (let k = 0; k < 2; k++) {
        const i = Math.floor(r() * notes.length);
        notes[i][2] = Math.max(0, Math.min(6, notes[i][2] + (r() < 0.5 ? -1 : 1)));
      }
      return notes;
    }
    const notes = [];
    let s = 0;
    while (s < 16) {
      const len = 1 + Math.floor(r() * 3);
      if (r() < 0.65) notes.push([s, Math.min(len, 16 - s), Math.floor(r() * 7)]);
      s += len + Math.floor(r() * 2);
    }
    return notes;
  }
  renderVals() {
    const st = this.state;
    const set = (patch) => () => this.setState(patch);
    const C = 138.2;
    const ring = (f) => (C * f).toFixed(1) + ' 200';
    const pos = st.step % 16;
    const beat = Math.floor(pos / 4) + 1;
    const blink = pos % 2 === 0;
    const wait = (cond) => (cond ? (blink ? 'wait' : 'off') : null);
    const padStyle = (state, c, muted) => 'height: 84px; border: none; cursor: pointer; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; box-sizing: border-box; font-family: Inter, sans-serif;' +
      (state === 'on' ? 'background: ' + c + '; color: #0A0A0B;' :
        state === 'wait' ? 'background: ' + muted + '; color: #E8E8EA; outline: 2px dashed ' + c + '; outline-offset: -2px;' :
          'background: #1A1A1D; color: #E8E8EA;');
    const MODES = ['Hot Cue', 'Sampler', 'FX', 'Loop'];
    const tabStyle = (on, c) => 'height: 32px; padding: 0 10px; border: none; cursor: pointer; border-radius: 4px; font-family: Inter, sans-serif; font-size: 12px; font-weight: 700;' +
      (on ? 'background: ' + c + '; color: #0A0A0B;' : 'background: #1A1A1D; color: #8A8A90;');
    const shiftStyle = 'height: 36px; cursor: pointer; border-radius: 4px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 700;' +
      (st.shift ? 'background: #E8E8EA; color: #0A0A0B; border: none;' : 'background: transparent; color: #8A8A90; border: 1px solid #3A3A40;');
    const A = st.modeA, B = st.modeB, sh = st.shift;

    let padsA;
    if (A === 0 && !sh) {
      padsA = [1, 2, 3, 4].map((n) => ({ name: String(n), sub: 'PATTERN', state: st.pattern === n ? 'on' : (wait(st.pendingPattern === n) || 'off'), press: set({ pendingPattern: n === st.pattern ? null : n }) }));
    } else if (A === 0) {
      padsA = [1, 2, 3, 4].map((n) => ({ name: 'L' + n, sub: 'LIGNE BASSE', state: st.line === n ? 'on' : (wait(st.pendingLine === n) || 'off'), press: set({ pendingLine: n }) }));
    } else if (A === 1 && !sh) {
      padsA = [1, 2, 3, 4].map((n) => ({ name: 'F' + n, sub: 'REMPLISSAGE', state: st.fill && st.fill.n === n ? (st.fill.armed ? (wait(true) || 'off') : 'on') : 'off', press: set({ fill: { n, armed: true } }) }));
    } else if (A === 1) {
      padsA = ['808', '909', 'Dub'].map((k) => ({ name: k, sub: 'KIT', state: st.kit === k ? 'on' : (wait(st.pendingKit === k) || 'off'), press: set({ pendingKit: k }) }))
        .concat([{ name: '⚄', sub: 'BASSE HASARD', state: wait(st.pendingLine === 0) || 'off', press: set({ pendingLine: 0 }) }]);
    } else if (A === 2) {
      padsA = ['Kick', 'Rim', 'Hats', 'Perc'].map((v, i) => ({ name: v, sub: 'MUTE', state: st.mutes[i] ? 'off' : 'on', press: () => { const m = st.mutes.slice(); m[i] = !m[i]; this.setState({ mutes: m }); } }));
    } else {
      padsA = ['1/4', '1/8', '1/16', '1/32'].map((v) => ({ name: v, sub: 'REPEAT · TENU', state: st.repeat === v ? 'on' : 'off', press: set({ repeat: st.repeat === v ? null : v }) }));
    }
    const CH = sh ? ['ii', 'III', 'VII', "i'"] : ['i7', 'iv7', 'v9', 'VI7'];
    let padsB;
    if (B === 0) {
      padsB = CH.map((n, i) => ({ name: n, sub: 'ACCORD', state: st.chords[i] && !sh ? 'on' : 'off', press: () => { const c = [false, false, false, false]; c[i] = !st.chords[i]; this.setState({ chords: c }); } }));
    } else if (B === 1) {
      const p = st.pendingPhrase;
      padsB = [
        { name: 'Générer', sub: 'PHRASE', state: p && p.kind === 'gen' ? (wait(true) || 'off') : 'off', press: () => this.setState({ pendingPhrase: { kind: 'gen', notes: this.phraseFrom(null) }, frozen: false }) },
        { name: 'Muter', sub: 'PHRASE', state: p && p.kind === 'mut' ? (wait(true) || 'off') : 'off', press: () => this.setState({ pendingPhrase: { kind: 'mut', notes: this.phraseFrom(st.phrase) } }) },
        { name: 'Figer', sub: 'PHRASE', state: st.frozen ? 'on' : 'off', press: set({ frozen: !st.frozen }) },
        { name: 'Effacer', sub: 'PHRASE', state: 'off', press: set({ phrase: [], pendingPhrase: null }) }
      ];
    } else if (B === 2) {
      const DT = ['3/16', '1/4', '1/8', '3/8'];
      padsB = [
        { name: 'Delay', sub: 'THROW · TENU', state: st.throwD ? 'on' : 'off', press: set({ throwD: !st.throwD }) },
        { name: 'Réverb', sub: 'THROW · TENU', state: st.throwR ? 'on' : 'off', press: set({ throwR: !st.throwR }) },
        { name: DT[st.delayTime], sub: 'TEMPS DELAY', state: 'off', press: set({ delayTime: (st.delayTime + 1) % 4 }) },
        { name: 'Arp', sub: 'ARPÈGE', state: st.arp ? 'on' : 'off', press: set({ arp: !st.arp }) }
      ];
    } else {
      const EXT = ['triade', '7e', 'sus4', 'add9'];
      padsB = [
        { name: 'Rec', sub: 'PAR-DESSUS', state: st.rec ? 'rec' : 'off', press: set({ rec: !st.rec }) },
        { name: 'Latch', sub: 'ACCORDS', state: st.latch ? 'on' : 'off', press: set({ latch: !st.latch }) },
        { name: (st.octave >= 0 ? '+' : '') + st.octave, sub: 'OCTAVE', state: 'off', press: set({ octave: st.octave >= 1 ? -1 : st.octave + 1 }) },
        { name: EXT[st.ext], sub: 'EXTENSION', state: 'off', press: set({ ext: (st.ext + 1) % 4 }) }
      ];
    }
    const styleA = (p) => ({ ...p, style: padStyle(p.state, '#FF6A2B', '#4F2514') });
    const styleB = (p) => ({ ...p, style: p.state === 'rec' ? padStyle('on', '#FF3DA8', '#4F1837') : padStyle(p.state, '#2BC8FF', '#133F4F') });

    const ctlA = sh ? ['Filter A', 'Shift + Bass A', 'Shift + Tempo A', 'Shift + Volume A'] : ['Filter A', 'Bass A', 'Tempo A', 'Volume A'];
    const ringsA = (sh
      ? [['Coupure', '35 %', 0.35], ['Env.', '45 %', 0.45], ['Decay amp', '60 %', 0.6], ['Basse', '70 %', 0.7]]
      : [['Coupure', '35 %', 0.35], ['Réso', '60 %', 0.6], ['Decay', '220 ms', 0.3], ['Rythme', '80 %', 0.8]])
      .map(([name, value, f], i) => ({ name, value, ctl: ctlA[i], dash: ring(f), color: i === 3 && !sh ? '#FF6A2B' : '#E8A33D' }));
    const ctlB = sh ? ['Tempo B', 'Filter B', 'Shift + Bass B', 'Volume B'] : ['Tempo B', 'Filter B', 'Bass B', 'Volume B'];
    const ringsB = (sh
      ? [['Densité', '60 %', 0.6], ['Brillance', '50 %', 0.5], ['Répét.', '70 %', 0.7], ['Mélodie', '75 %', 0.75]]
      : [['Densité', '60 %', 0.6], ['Brillance', '50 %', 0.5], ['Delay', '55 %', 0.55], ['Mélodie', '75 %', 0.75]])
      .map(([name, value, f], i) => ({ name, value, ctl: ctlB[i], dash: ring(f), color: '#2BC8FF' }));
    const hintsA = ['Hot Cue A · pattern à la mesure ; Shift : ligne de basse', 'Sampler A · remplissage ; Shift : kit, basse au hasard', 'FX A · allumé = la voix joue', 'Loop A · beat-repeat tant que le pad est tenu'];
    const hintsB = ['Hot Cue B · accord tenu (latch) ; Shift : 4 autres degrés', 'Sampler B · générer et muter tombent à la mesure', 'FX B · throw = envoi tant que le pad est tenu', 'Loop B · rec tenu = enregistre par-dessus la phrase'];
    const sides = [
      { order: 1, title: 'A · RYTHME + BASSE', side: 'deck gauche', color: '#FF6A2B', rings: ringsA, tabs: MODES.map((m, i) => ({ name: m, style: tabStyle(A === i, '#FF6A2B'), pick: set({ modeA: i }) })), pads: padsA.map(styleA), padHint: hintsA[A], jogHint: 'Jog A : tranche = densité · dessus = swing · Shift = tempo' },
      { order: 3, title: 'B · ACCORDS + PHRASE', side: 'deck droit', color: '#2BC8FF', rings: ringsB, tabs: MODES.map((m, i) => ({ name: m, style: tabStyle(B === i, '#2BC8FF'), pick: set({ modeB: i }) })), pads: padsB.map(styleB), padHint: hintsB[B], jogHint: 'Jog B : tranche = registre · dessus = transposition · Shift = gamme' }
    ];

    // The screen: three tracks under one playhead.
    const W = 100; // percent
    const x = (s) => (s * W / 16);
    const at = (s, len, top, h, c) => 'position: absolute; left: calc(' + x(s) + '% + 2px); top: ' + top + 'px; width: calc(' + x(len) + '% - 4px); height: ' + h + 'px; border-radius: 2px; background: ' + c + ';';
    const grid = [4, 8, 12].map((s) => 'position: absolute; top: 0; bottom: 0; left: ' + x(s) + '%; width: 1px; background: #2A2A2E;');
    const PAT = {
      1: { kick: [0, 4, 8, 12], rim: [6, 14], hats: [2, 6, 10, 14], perc: [] },
      2: { kick: [0, 4, 8, 12], rim: [4, 12], hats: [2, 6, 10, 14], perc: [3, 9] },
      3: { kick: [0, 4, 8, 12], rim: [7, 15], hats: [0, 2, 3, 5, 6, 8, 10, 11, 13, 14], perc: [] },
      4: { kick: [0, 4, 8, 12, 15], rim: [4, 7, 12], hats: [2, 6, 10, 14], perc: [1, 6, 9, 14] }
    }[st.pattern];
    const rows = [['kick', '#FF6A2B', 14], ['rim', '#944221', 8], ['hats', '#944221', 8], ['perc', '#944221', 8]];
    const drums = [];
    let top = 6;
    rows.forEach(([k, c, h], i) => {
      if (!st.mutes[i]) PAT[k].forEach((s) => drums.push(at(s, 1, top, h, c)));
      top += h + 6;
    });
    const LINES = { 0: [[1, 1, 2], [5, 1, 1], [9, 2, 3], [13, 1, 2]], 1: [[2, 1, 2], [6, 1, 2], [10, 1, 2], [14, 1, 2]], 2: [[2, 2, 2], [6, 1, 2], [10, 2, 1], [14, 1, 2]], 3: [[2, 1, 2], [5, 1, 2], [10, 1, 0], [13, 1, 2]], 4: [[2, 2, 2], [6, 2, 2], [10, 2, 1], [14, 2, 0]] };
    const bass = LINES[st.line].map(([s, l, r]) => at(s, l, 8 + (3 - r) * 12, 10, '#E8A33D'));
    const mel = st.phrase.map(([s, l, r]) => at(s, l, 8 + (6 - r) * 15, 11, '#2BC8FF'));
    const box = (h) => 'position: relative; height: ' + h + 'px; background: #0A0A0B; border-radius: 4px; overflow: hidden;';
    const tracks = [
      { name: 'RYTHME', color: '#FF6A2B', info: 'pattern ' + st.pattern + ' · densité 70 %', box: box(66), grid, marks: drums },
      { name: 'BASSE', color: '#E8A33D', info: (st.line ? 'ligne ' + st.line : 'ligne au hasard') + ' · coupure 35 %', box: box(56), grid, marks: bass },
      { name: 'PHRASE', color: '#2BC8FF', info: (st.frozen ? 'figée' : 'libre') + ' · ' + st.phrase.length + ' notes · ' + (['i7', 'iv7', 'v9', 'VI7'].filter((_, i) => st.chords[i]).join(' ') || 'pas d’accord'), box: box(122), grid, marks: mel }
    ];
    const playhead = 'position: absolute; top: 0; bottom: 0; left: ' + x(pos + 0.5) + '%; width: 2px; background: #E8E8EA;';
    const beats = [1, 2, 3, 4].map((b) => 'width: 14px; height: 14px; border-radius: 2px; background: ' + (b === beat ? '#E8E8EA' : '#2A2A2E') + ';');
    const q = [];
    const qs = (c) => 'padding: 6px 10px; border-radius: 4px; border: 2px dashed ' + c + '; color: ' + c + '; font-size: 14px;';
    if (st.pendingPattern !== null) q.push({ text: 'pattern ' + st.pendingPattern, style: qs('#FF6A2B') });
    if (st.pendingLine !== null) q.push({ text: st.pendingLine ? 'ligne ' + st.pendingLine : 'basse au hasard', style: qs('#E8A33D') });
    if (st.pendingKit !== null) q.push({ text: 'kit ' + st.pendingKit, style: qs('#FF6A2B') });
    if (st.pendingPhrase !== null) q.push({ text: st.pendingPhrase.kind === 'gen' ? 'phrase générée' : 'phrase mutée', style: qs('#2BC8FF') });
    const left = 4 - (beat - 1);
    const mixer = [{ name: 'Master', value: '90 %', ctl: 'Master', f: 0.9 }, { name: 'Réverb', value: '40 %', ctl: 'Headphone', f: 0.4 }].map((k) => ({ ...k, dash: ring(k.f) }));
    return {
      sides, tracks, playhead, beats, queue: q, queueEmpty: q.length === 0,
      untilBar: q.length ? 'dans ' + left + ' temps' : '',
      position: (Math.floor(st.step / 16) + 1) + '.' + beat, kit: st.kit, mixer, shiftStyle,
      playing: st.playing, stopped: !st.playing,
      togglePlay: set({ playing: !st.playing }), toggleShift: set({ shift: !st.shift })
    };
  }
}
</script>
</body>
